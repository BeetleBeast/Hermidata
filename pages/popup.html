<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermidata</title>
    <script src="/scripts/theme-init.js"></script>
    <link rel="stylesheet" href="../assets/styles/popup/classic.css">
    <link rel="stylesheet" href="../assets/styles/marker/general.css">
    <link rel="stylesheet" href="../assets/styles/marker/main-menu.css">
    <link rel="stylesheet" href="../assets/styles/marker/manager-menu.css">
    <link rel="stylesheet" href="../assets/styles/marker/add-marker-menu.css">
    <link rel="stylesheet" href="../assets/styles/general/theme.css">
    <link rel="stylesheet" href="../assets/styles/general/errors.css">
    <link rel="stylesheet" href="../assets/styles/general/buttons.css">
    <link rel="stylesheet" href="../assets/styles/general/context-menu.css">
    <link rel="stylesheet" href="../assets/styles/general/prompts.css">
    <link rel="stylesheet" href="../assets/styles/general/loading.css">
    <link rel="stylesheet" href="../assets/styles/general/dual-range-slider.css">
    <link rel="stylesheet" href="../assets/styles/popup/rss-feed.css">
    <link rel="stylesheet" href="../assets/styles/popup/item-chooser.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=progress_activity" />
</head>
<body>
    <div id="header" class="HDSwitcher" role="group" aria-label="View mode">
        <button id="HDClassicBtn" type="button" class="Btn active" aria-pressed="true">Classic</button>
        <button id="HDRssBtn" type="button" class="Btn" aria-pressed="false">RSS<span id="subscribableHint" class="subscribableHint" hidden aria-hidden="true"></span></button>
    </div>
<section id="body" class="HDClassic">
    <section class="main">
        <div class="topMain">
            <button id="openBookmarkMenu" class="marker-menu-trigger" type="button" popovertarget="bookmark-menu" popovertargetaction="toggle" aria-label="Change marker" title="Open marker menu">
            <svg class="openBookmarkMenu imgBookmark" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" aria-hidden="true">
                    <g class="imgBookmark-g">
                        <path d="M240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h480q33 0 56.5 23.5T800-800v640q0 33-23.5 56.5T720-80H240Zm0-80h480v-640h-80v280l-100-60-100 60v-280H240v640Zm0 0v-640 640Zm200-360 100-60 100 60-100-60-100 60Z">
                            <title class="RSSBookmarkMenuImg-title">Change Marker</title>
                        </path>
                    </g>
                </svg>
            </button>
            <input id="title" class="autoInput" data-name="Title" type="text" spellcheck="false" placeholder="Title" aria-label="Title" />
            <button class="openSettings" type="button" aria-label="Open settings" title="Settings">
                <img alt="" class="icon imgSettings" src='../assets/icon/settings_24.png'/>
            </button>
        </div>
        <div class="table-2-container">
            <table class="table-2">
                <thead>
                    <tr>
                    <th class="HEADER" scope="col">Chapter</th>
                    <th class="HEADER" scope="col">Type</th>
                    <th class="HEADER" scope="col">Read Status</th>
                    <th class="HEADER" scope="col">Novel Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><div class="chapter-container">
                                <p id="previousChapter" class="autoInput" data-name="PreviousChapter" type="number" aria-label="Previous chapter"></p>
                                <span id="chapterArrow" aria-hidden="true">=></span>
                                <input id="chapter" class="autoInput" data-name="Chapter" type="number" placeholder="Chapter" aria-label="Current chapter"/>
                        </td></div>
                        <td><select id="Type" class="autoInput" data-name="Type" type="text" title="Type" aria-label="Type"></select></td>
                        <td><select id="status" class="autoInput" data-name="Status" type="text" title="Status" aria-label="Read status"></select></td>
                        <td><select id="NovelStatus" class="autoInput" data-name="NovelStatus" type="text" title="NovelStatus" aria-label="Novel status"></select></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="table-1-container">
            <table class="table-1">
                <tr class="table-1-tags-container">
                    <th class="HEADER tags-header" scope="row">Tags</th>
                    <td class="tags-container">
                        <div class="autocomplete-wrapper">
                            <input id="tags" class="autoInput" data-name="Tag" type="text" placeholder="add tag..." aria-label="Add tag" autocomplete="off" />
                            <span class="autocomplete-ghost" aria-hidden="true"></span>
                        </div>
                        <div id="tag-pill-container" role="list" aria-label="Tags"></div>
                    </td>
                </tr>
                <tr>
                    <th class="HEADER notes-header" scope="row">Notes</th>
                    <td><input id="notes" class="autoInput" data-name="Notes" type="text" placeholder="optional..." aria-label="Notes" /></td>
                </tr>
            </table>
        </div>
    </section>
    <section class="footer">
        <div id="Btn-Parent">
            <!-- data-separate: hidden | subtle | visible | primary, set by the popup from how sure the match is -->
            <div class="saveActions" data-separate="hidden">
                <button type="button" class="Btn" id="save" aria-busy="false">
                    <span id="save-label">Save</span>
                    <span class="save-spinner" aria-hidden="true"></span>
                </button>
                <button type="button" class="saveSeparate" id="saveSeparate" title="Keep the saved item as it is and save this page as its own item">
                    <svg class="saveSeparate-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2.4"/><circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="9" r="2.4"/><path d="M6 7.5v9M18 11.5c0 3-6 2-12 5"/></svg>
                    <span class="saveSeparate-spinner" aria-hidden="true"></span>
                    <span class="saveSeparate-label">Save as separate item</span>
                </button>
            </div>
            <div class="RSSLinkState-container">
                <svg class="RSSLinkState-svg" role="img" aria-label="this Item is not linked to a RSS feed">
                    <g class="RSSLinkState-g">
                        <polygon points="0,-12 12,0 0,12 -12,0" class="RSSLinkState-polygon"><title class="RSSLinkState-title">this Item is not linked to a RSS feed</title></polygon>
                    </g>
                </svg>
                <h3 id="isNewHermidata" role="status" aria-live="polite"></h3>
            </div>
            <div class="versionContainer">Version: <span class="version">v0.18.4</span></div>
        </div>
    </section>
</section>
<section class="HDRss">
    <div id="HDRss-subscribe-container">
        <input id="title_HDRss" class="HDRss_Input" data-name="Title" type="text" spellcheck="false" placeholder="Title" aria-label="Title" disabled />
        <select id="Type_HDRss" class="HDRss_Input" data-name="Type" title="Type" aria-label="Type" disabled></select>
        <button id="subscribeBtn" type="button" class="Btn" disabled>Subscribe to new RSS feed</button>
    </div>
    <section id="sort-RSS-entries" aria-label="Sort and filter RSS entries"><!-- Dynamic load sort items--></section>
    <section id="RSS-Notification" aria-label="RSS notifications"><!-- Dynamic load items--></section>
    <section id="All-RSS-entries" aria-label="All RSS entries"><!-- Dynamic load items--></section>
    <footer>
        <button type="button" id="clear-notifications" class="Btn">Clear notifications</button>
        <button type="button" id="openLibraryBtn" class="library-btn Btn" aria-label="Open Library page in a new tab">Open Library page</button>
        <div id="RSS-latest-sync-div" role="status">RSS: <span id="lastSync">Never</span></div> 
        <button type="button" id="RSS-sync-Manual" class="Btn">Manual sync</button>
        <span id="version">v1.4.3</span>
    </footer>
</section>
<section class="promptSection">
    <div class="genericPromptParent">
        <label for="genericInput" class="genericLabel"></label>
        <input id="genericInput" class="genericInput" title="title" type="text" />
        <div class="genericPromptBtns">
            <button type="button" class="genericButton1 Btn" >Save</button>
            <button type="button" class="genericButton2 Btn" >Cancel</button>
        </div>
    </div>
</section>
<section id="bookmark-add-marker" class="AddNewBookmark markerPopover" popover="manual">
    <div class="markerPopover-header">
        <h4>Add marker</h4>
        <button type="button" class="markerPopover-close" popovertarget="bookmark-add-marker" popovertargetaction="hide" aria-label="Close add marker form">×</button>
    </div>
    <label for="bookmarkLabelInput" id="bookmarkLabelInput-label">Marker's label</label>
    <input type="text" id="bookmarkLabelInput" />
    <div id="bookmarkChapterContainer">
        <label for="bookmarkChapterInput" id="bookmarkChapterInput-label">chapter
            <input type="number" id="bookmarkChapterInput"/>
        </label>
        <label for="bookmarkNotesInput" id="bookmarkNotesInput-label">optional notes
            <input type="text" id="bookmarkNotesInput" placeholder="type here..."/>
        </label>
        <label for="bookmarkColorInput" id="bookmarkColorInput-label">color
            <button type="button" id="bookmarkColorInput" aria-label="Choose marker color"></button>
        </label>
    </div>
    <div class="buttonContainer">
        <button type="button" id="cancelBookmarkBtn" class="Btn" popovertarget="bookmark-add-marker" popovertargetaction="hide">Cancel</button>
        <button type="button" id="saveBookmarkBtn" class="Btn">Add Marker</button>
    </div>
</section>
<section id="bookmark-manager" class="bookmarkMenuManagerContainer markerPopover" popover="manual">
    <div class="bookmarkMenuManager-header">
        <div id="bookmarkManagerSortControls" class="marker-sort-controls" role="group" aria-label="Sort markers">
            <select id="bookmarkManagerSort" class="marker-sort" aria-label="Sort markers by">
                <option value="updatedAt">Last edited</option>
                <option value="createdAt">Created</option>
                <option value="lastUsedAt">Last used</option>
            </select>
            <button type="button" id="bookmarkManagerSortDirection" class="marker-sort-direction Btn" aria-label="Change sort direction; currently descending" title="Sort descending">↑</button>
        </div>
        <h4 class="bookmarkMenuManager-title">Manage markers</h4>
        <button type="button" id="cancelBookmarkMenuBtn" class="markerPopover-close" popovertarget="bookmark-manager" popovertargetaction="hide" aria-label="Close marker manager">×</button>
    </div>
    <div id="bookmarkMenuManager"> <!-- Dynamic load Bookmarks --> </div>
    <nav id="bookmarkManagerPagination" class="marker-pagination" aria-label="Manage markers pages" hidden>
        <button type="button" class="marker-page-previous Btn" aria-label="Previous page">Previous</button>
        <span class="marker-page-status" aria-live="polite"></span>
        <button type="button" class="marker-page-next Btn" aria-label="Next page">Next</button>
    </nav>
    <button type="button" class="addNewBookmarkBtn" id="addNewBookmarkBtn-manager" popovertarget="bookmark-add-marker" popovertargetaction="show">Add Marker</button>
    <br>
    <small class="bookmarkMenuManager-sub">Tip: Primary Marker cannot be removed.</small>
</section>
<section id="bookmark-menu" class="bookmarkMenuContainer markerPopover" popover="manual">
    <div class="markerPopover-header">
        <div id="bookmarkMenuSortControls" class="marker-sort-controls" role="group" aria-label="Sort markers">
            <select id="bookmarkMenuSort" class="marker-sort" aria-label="Sort markers by">
                <option value="updatedAt">Last edited</option>
                <option value="createdAt">Created</option>
                <option value="lastUsedAt">Last used</option>
            </select>
            <button type="button" id="bookmarkMenuSortDirection" class="marker-sort-direction Btn" aria-label="Change sort direction; currently descending" title="Sort descending">↑</button>
        </div>
        <h4>Markers</h4>
        <button type="button" class="markerPopover-close" popovertarget="bookmark-menu" popovertargetaction="hide" aria-label="Close marker menu">×</button>
    </div>
    <div class="bookmarkMenu"> <!-- Dynamic load Bookmark label + chapter current --> </div>
    <nav id="bookmarkMenuPagination" class="marker-pagination" aria-label="Markers pages" hidden>
        <button type="button" class="marker-page-previous Btn" aria-label="Previous page">Previous</button>
        <span class="marker-page-status" aria-live="polite"></span>
        <button type="button" class="marker-page-next Btn" aria-label="Next page">Next</button>
    </nav>
    <button type="button" class="addNewBookmarkBtn" id="addNewBookmarkBtn-Menu" popovertarget="bookmark-add-marker" popovertargetaction="show">Add Marker</button>
    <hr>
    <button type="button" class="bookmarkMenuBtn Btn" popovertarget="bookmark-manager" popovertargetaction="show">Marker Manager</button>
</section>
<dialog id="itemChooser" class="itemChooser" aria-labelledby="itemChooser-title">
    <div class="itemChooser-header">
        <h4 id="itemChooser-title">Which item is this?</h4>
        <button type="button" id="itemChooser-none" class="itemChooser-none" title="Treat this page as a new item">None of these</button>
    </div>
    <ul class="itemChooser-list"> <!-- Dynamic load candidates --> </ul>
</dialog>
<section class="material-symbols-outlinedContainer" role="status" aria-live="polite" aria-label="Loading">
    <br>
    <div class="loading-bar-container" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100">
        <div class="loading-bar"></div>
    </div>
    <br>
    <span class="loading-bar-label"></span>
</section>
<section id="spreadsheetPrompt">
    <label for="sheetUrlInput">Enter Spreadsheet URL:</label>
    <input type="text" id="sheetUrlInput" />
    <button type="button" id="saveSheetUrlBtn" class="Btn">Save</button>
</section>
    <script src="../scripts/popup/in/main.ts" type="module"></script>
</body>
</html>
