<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hermidata — RSS / Library</title>
<script src="/scripts/theme-init.js"></script>
<link rel="stylesheet" href="../assets/styles/general/theme.css">
<link rel="stylesheet" href="../assets/styles/general/errors.css">
<link rel="stylesheet" href="../assets/styles/general/buttons.css">
<link rel="stylesheet" href="../assets/styles/general/context-menu.css">
<link rel="stylesheet" href="../assets/styles/general/prompts.css">
<link rel="stylesheet" href="../assets/styles/general/loading.css">
<link rel="stylesheet" href="../assets/styles/general/dual-range-slider.css">
<link rel="stylesheet" href="../assets/styles/library/base.css">
<link rel="stylesheet" href="../assets/styles/library/feed.css">
<link rel="stylesheet" href="../assets/styles/library/merger.css">
</head>
<body data-list-mode="true">

  <section class="topBar">
    <h1>Hermidata Library</h1>
    <div class="toolbar">
      
      <button type="button" popovertargetaction="toggle" popovertarget="merger-dialog" id="mergeTwoHermidatas" class="Btn" aria-haspopup="dialog">merge two hermidata's</button>
      <!-- Planned top bar options, not built yet ( TODO ):
      <button type="button" id="bulkOpen" class="Btn">Open in new tabs</button>
      <button type="button" id="openNotifications" class="Btn">Notifications</button>
      <button type="button" id="openStats" class="Btn">Stats &amp; insights</button>
      -->
      <button type="button" id="openReadingList" class="Btn">Reading list</button>
      <button type="button" id="reloadData" class="Btn">Reload</button>
      <div id="merger-dialog" class="filter-dialog" popover role="dialog" aria-label="Merge two hermidata's">
        <div class="merger-dialog-progression-container">
          <div class="merger-dialog-progression merger-dialog-progression-1" data-progression="2">
            <p class="merger-dialog-progression-1-text">✓</p>
          </div>
          <p class="merger-dialog-progression-1-main-text" data-progression="2">Keep record A</p>
          <svg class="merger-dialog-progression-line">
            <line x1="0" y1="25" x2="100%" y2="25" stroke="var(--border)" stroke-width="1"></line>
          </svg>
          <div class="merger-dialog-progression merger-dialog-progression-2" data-progression="2">
            <p class="merger-dialog-progression-2-text" data-progression="2">2</p>
          </div>
          <p class="merger-dialog-progression-2-main-text" data-progression="2">Resolve conflict</p>
        </div>
        
      </div>
    </div>
  </section>

  <section id="search-filter-container">
    <div id="search-input-container">
      <div id="search-controls-container">
        <div id="search-container">
          <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
          <input id="search" placeholder="Search titles..." type="search" aria-label="Search titles" autocomplete="off" />
        </div>
        <button id="toggle-filters" type="button" aria-controls="filter-container" aria-expanded="true">Hide filters</button>
      </div>
      <div id="search-suggestions" aria-label="Title suggestions"></div>
    </div>
    <div id="filter-container">
      <div class="filter-row-1">
        <div id="StarRating-filter-container" class="filter-container">
          <h4 id="StarRating-filter-label">Star Rating</h4>
          <button id="StarRating-filter" class="filter-button" aria-labelledby="StarRating-filter-label StarRating-filter" aria-haspopup="dialog" title="Star Rating" type="button" data-filter-type="star-rating" popovertargetaction="toggle" popovertarget="StarRating-dialog">Any</button>
          
          <div id="StarRating-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="StarRating-filter-label">
          </div>
        </div>
        <div id="ContentRating-filter-container" class="filter-container">
          <h4 id="ContentRating-filter-label">Content Rating</h4>
          <button id="ContentRating-filter" class="filter-button" aria-labelledby="ContentRating-filter-label ContentRating-filter" aria-haspopup="dialog" title="Content Rating" data-filter-type="Content Rating" type="button" popovertargetaction="toggle" popovertarget="ContentRating-dialog">Any</button>
          
          <div id="ContentRating-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="ContentRating-filter-label">
          </div>
        </div>
        <div id="NovelType-filter-container" class="filter-container">
          <h4 id="NovelType-filter-label">Novel Type</h4>
          <button id="NovelType-filter" class="filter-button" aria-labelledby="NovelType-filter-label NovelType-filter" aria-haspopup="dialog" title="Novel Type" type="button" data-filter-type="Novel Type" popovertargetaction="toggle" popovertarget="NovelType-dialog">Any</button>
          
          <div id="NovelType-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="NovelType-filter-label">
          </div>
        </div>
        <div id="Genres-filter-container" class="filter-container">
          <h4 id="Genres-filter-label">Genres & themes</h4>
          <button id="Genres-filter" class="filter-button" aria-labelledby="Genres-filter-label Genres-filter" aria-haspopup="dialog" title="Genres & themes" type="button" data-filter-type="Genres & Themes" popovertargetaction="toggle" popovertarget="Genres-dialog">Any</button>
          
          <div id="Genres-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="Genres-filter-label">
          </div>
        </div>
        <div id="NovelStatus-filter-container" class="filter-container">
          <h4 id="NovelStatus-filter-label">Novel Status</h4>
          <button id="NovelStatus-filter" class="filter-button" aria-labelledby="NovelStatus-filter-label NovelStatus-filter" aria-haspopup="dialog" title="Novel Status" type="button" data-filter-type="Novel Status" popovertargetaction="toggle" popovertarget="NovelStatus-dialog">Any</button>
          
          <div id="NovelStatus-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="NovelStatus-filter-label">
          </div>
        </div>
      </div>
      <div class="filter-row-2">
        <div id="Sort-filter-container" class="filter-container">
          <h4 id="Sort-filter-label">Sort</h4>
          <button id="Sort-filter" class="filter-button" aria-labelledby="Sort-filter-label Sort-filter" aria-haspopup="dialog" title="Sort" type="button" popovertargetaction="toggle" popovertarget="Sort-dialog">Alphabetical</button>
          
          <div id="Sort-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="Sort-filter-label">
          </div>
        </div>
        <div id="Site-filter-container" class="filter-container">
          <h4 id="Site-filter-label">Site</h4>
          <button id="Site-filter" class="filter-button" aria-labelledby="Site-filter-label Site-filter" aria-haspopup="dialog" title="Site" type="button" data-filter-type="Site" popovertargetaction="toggle" popovertarget="Site-dialog">Open Site dialog</button>
          
          <div id="Site-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="Site-filter-label">
          </div>
          
        </div>
        <div id="Author-filter-container" class="filter-container">
          <h4 id="Author-filter-label">Author</h4>

          <button id="Author-filter" class="filter-button" aria-labelledby="Author-filter-label Author-filter" aria-haspopup="dialog" title="Author" type="button" data-filter-type="Author" popovertargetaction="toggle" popovertarget="Author-dialog">Author</button>
          
          <div id="Author-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="Author-filter-label">
            <div id="Author-input-container">
              <input id="Author-filter-input" title="Author" type="search" aria-label="Filter by author" autocomplete="off" />
              <p id="Author-filter-suggestions" aria-label="Author suggestions"></p>
            </div>
          </div>

        </div>
        <div id="ReleaseDate-filter-container" class="filter-container">
          <h4 id="ReleaseDate-filter-label">Release Date</h4>
          <button id="ReleaseDate-filter" class="filter-button" aria-labelledby="ReleaseDate-filter-label ReleaseDate-filter" aria-haspopup="dialog" title="Release Date" type="button" data-filter-type="Release Date" popovertargetaction="toggle" popovertarget="ReleaseDate-dialog">Any</button>
          
          <div id="ReleaseDate-dialog" class="filter-dialog" popover role="dialog" aria-labelledby="ReleaseDate-filter-label"></div>

        </div>
        <div id="ChapterCompletion-filter-container" class="filter-container">
          <h4 id="ChapterCompletion-filter-label">Minimum chapters read</h4>
          <input id="ChapterCompletion-filter" class="filter-button" title="minimum completion percentage" aria-labelledby="ChapterCompletion-filter-label" type="number" min="0" placeholder="0" oninput="this.value = this.value.replace(/[^0-9.-]/g, '');" value=""/>
        </div>
        <div id="ResetFilters" class="filter-container">
          <h4 id="resetFilters-label-hidden" aria-hidden="true">0</h4>
          <button type="button" id="resetFilters" class="filter-button Btn">Reset Filters</button>
        </div>
      </div>
    </div>
  </section>

  <section id="library-container">
    <div id="library-entries-info">
      <div id="library-entries-info-amount-container" role="status" aria-live="polite">
        <span id="library-entries-info-amount">0</span><p id="library-entries-info-amount-label">titles</p>
      </div>
      <div id="library-entries-ViewMode-container">
        <div id="library-entries-ViewMode-toggle" role="group" aria-label="View Mode">
          <button id="library-entries-ViewMode-list" class="viewMode-toggle" type="button" aria-label="List View" aria-pressed="true" data-active_view_mode="true" >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          </button>
          <button id="library-entries-ViewMode-grid" class="viewMode-toggle" type="button" aria-label="Grid View" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
          </button>

        </div>
      </div>
    </div>
    <div id="library-entries-container"><!-- Dynamic load items--></div>
    <p id="library-empty-message" class="empty-list-message" role="status" aria-live="polite" hidden>No items</p>
  </section>




<script src="../scripts/library/main.ts" type="module"></script>
</body>
</html>
