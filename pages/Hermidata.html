
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermidata</title>
  <link rel="stylesheet" href="../assets/styles/styles.css">
  <link rel="stylesheet" href="../assets/styles/info.css">
</head>
<body>

  <section id="header">
    <button id="cancel-edit-btn" type="button" class="Btn" title="Cancel">Cancel</button>
    <div id="search-input-container">
      <div id="search-container">
        <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
        <input id="search" placeholder="Search..." />
      </div>
      <div id="search-suggestions"></div>
    </div>
    <div id="header-utility-container">
      <button id="edit-info-btn" type="button" class="Btn" title="Edit info page">Edit</button>
      <button id="reload-info-btn" type="button" class="Btn" title="reload info page">Reload</button>
    </div>

  </section>

  <section id="info-container">
    <section id="hermidata-main">
      <div id="hermidata-img-container"><!-- Dynamic load image --> </div>
      <button id="hermidata-readLatest-btn" type="button" class="Btn" title="Read latest chapter">Read Latest</button>
      <div id="hermidata-info-container">
        <h2 id="hermidata-title"></h2>
        <div id="hermidata-alternative-titles-container"></div>
        <div id="hermidata-metadata-container">
          <div id="hermidata-novelType"></div>
          <div id="hermidata-contentRating"></div>
          <div id="hermidata-releaseDate"></div>
          <div id="hermidata-novelStatus"></div>
        </div>
        <div id="hermidata-starRating-container">
          <div id="hermidata-starRating"></div>
          <div id="hermidata-starRating-edit"></div>
        </div>
        <div id="hermidata-genres-container">
          <div id="hermidata-genres-label">Genres</div>
          <div id="hermidata-genres"></div>
        </div>
        <div id="hermidata-demographics-container">
          <div id="hermidata-demographics-label">Demographics</div>
          <div id="hermidata-demographics"></div>
        </div>
        <div id="hermidata-sources-container">
          <div id="hermidata-sources-label">Source(s)</div>
          <div id="hermidata-sources"></div>
        </div>
        <div id="hermidata-latestRelease-container">
          <div id="hermidata-latestRelease-label">Latest Release</div>
          <div id="hermidata-latestRelease"></div>
        </div>
      </div>

    </section>
    <section id="hermidata-markers">
      <div id="hermidata-markers-container">
        <h3 id="hermidata-markers-label">Markers</h3>
        <div id="hermidata-markers-utility-container" class="search-container-parent">
          <div id="hermidata-markers-utility-search-container" class="search-container">
            <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
            <input id="search-marker" placeholder="Search chapter or marker label..." />
          </div>
          <div id="hermidata-markers-utility-sort-container">
            <div id="hermidata-markers-utility-sort-chapter" class="filter-button" title="Sort by latest chapter" data-state="true" data-sort="asc">Chapter</div>
            <div id="hermidata-markers-utility-sort-date" class="filter-button" title="Sort by date" data-state="false" data-sort="asc">Date</div>
          </div>
        </div>
        <div id="hermidata-markers-list">
          <!-- markers go here -->
        </div>
      </div>

    </section>
    <section id="hermidata-notes">
      <div id="hermidata-notes-container">
        <label for="hermidata-notes-content" id="hermidata-notes-label">Notes</label>
        <textarea id="hermidata-notes-content"></textarea>
      </div>
    </section>
  </section>

</body>
  <script src="../scripts/library/details.ts" type="module"></script>
</html>
